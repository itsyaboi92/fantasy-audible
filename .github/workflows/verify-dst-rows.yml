
name: Verify D/ST defensive rows

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Verify defensive rows
        run: python verify-dst-rows.py > dst-row-verification.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: dst-row-verification
          path: dst-row-verification.txt
