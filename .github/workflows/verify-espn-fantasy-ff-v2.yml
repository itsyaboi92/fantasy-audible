
name: Verify ESPN Fantasy Forced Fumbles V2

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run V2 verification
        run: node verify-espn-fantasy-ff-v2.js
