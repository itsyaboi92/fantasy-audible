
name: Verify ESPN Fantasy Forced Fumbles

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual week 9 forced fumbles
        run: node verify-espn-fantasy-ff.js
